  /* 1. The Container: Create a rigid grid template */

  }

  /* 2. Left Side: Image and Tags */

  /* Image sits in Column 1, Row 1 */

    grid-column: 1 !important;
    grid-row: 1 !important;
    width: 100px !important;
    height: 100px !important;
    margin: 0 0 108px 0 !important; /* Hardcoded bottom margin to leave exact room for the tags */
    display: block !important;

    /* --- TRANSPARENCY & CLEANUP FIXES --- */
    background: transparent !important; /* Forces the background to be completely clear */
    background-color: transparent !important; /* Double-down to override any inherited theme colors */
    border: none !important; /* Strips any default borders from Blogger */
    box-shadow: none !important; /* Removes any default shadows around the image container */
    padding: 0 !important; /* Removes any internal padding pushing the image */
  }

  /* Tags are absolutely positioned directly under the image */
  /* This prevents the height of the description from ever stretching them downward! */
  .trophy-tags {
    position: absolute !important;
    left: 0 !important;
    top: 108px !important; /* Positions them exactly 8px below the 100px tall image */
    width: 100px !important; /* Matches image width perfectly */
    display: flex !important;
    flex-direction: column !important;

    margin: 0 !important;
