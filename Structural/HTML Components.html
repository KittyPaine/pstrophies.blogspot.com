</div>

<!-- External Link -->
<a href="https://URL" target="_blank" rel="noopener noreferrer">Link Text</a>

<!-- Trophy Image Block -->

<!-- Metal Gear Solid Delta Guide Components -->
<h1 style="text-align: center; text-transform: uppercase">Mission Name</h1>

<div data-group="Mission Name">
  <h2 style="text-align: center; text-transform: uppercase">Location Name</h2>
</div>

<div data-group="Mission Name, Location Name" data-name="Collectible Name and Number" style="margin-bottom: 25px">
  <h3 style="margin-bottom: 5px">Collectible Name and Number</h3>

  <details>
    <summary style="cursor: pointer; font-weight: bold">🔍 Click to Expand Location &amp; Screenshots</summary>
    <div style="padding-top: 10px">
      <p>Step-by-step directions to the collectible.</p>

      <div style="text-align: center; margin-top: 15px">
        <img src="Location image URL" alt="Location screenshot description" style="max-width: 100%; height: auto; display: block; margin: 8px auto" />
        <img src="Map image URL" alt="Map screenshot description" style="max-width: 100%; height: auto; display: block; margin: 8px auto" />
      </div>
    </div>
  </details>
</div>
